<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amil FanArt - Cyber Sparkle Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    body {
      background: #1a0826;
      background-image: radial-gradient(at 0% 0%, rgba(255, 105, 180, 0.3) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(255, 182, 193, 0.3) 0px, transparent 50%);
      background-attachment: fixed; color: #333; min-height: 100vh;
    }
    header { text-align: center; padding: 3rem 1rem 2rem; }
    .header-title { font-size: 3rem; font-weight: 700; color: #fff; text-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493; }
    .header-sub { color: #ffe4e1; font-size: 1.1rem; margin-top: 0.5rem; }
    
    .upload-btn-main {
      display: inline-block; text-decoration: none; margin-top: 1.5rem;
      background: linear-gradient(45deg, #ff1493, #ff69b4); color: white; border: none;
      padding: 0.8rem 2rem; font-size: 1.1rem; font-weight: 600; border-radius: 50px; cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 20, 147, 0.6); transition: all 0.3s;
    }
    .upload-btn-main:hover { transform: scale(1.08); box-shadow: 0 0 30px rgba(255, 20, 147, 0.9); }

    .container { max-width: 1200px; margin: 1rem auto 4rem; padding: 0 1.5rem; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
    
    .card {
      background: rgba(255, 255, 255, 0.95); border-radius: 24px; overflow: hidden;
      border: 2px solid rgba(255, 182, 193, 0.5); transition: all 0.3s;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .card:hover { transform: translateY(-8px); border-color: #ff69b4; }
    .card-img-wrapper { width: 100%; padding-top: 100%; position: relative; cursor: pointer; overflow: hidden; }
    .card-img-wrapper img { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; transition: transform 0.3s; }
    .card-img-wrapper:hover img { transform: scale(1.05); }
    
    .card-body { padding: 1.2rem; }
    .card-title { font-size: 1.2rem; font-weight: 700; color: #2a0845; }
    .card-artist { font-size: 0.95rem; color: #ff1493; font-weight: 600; margin-bottom: 0.8rem; }
    
    .card-stats {
      display: flex; justify-content: space-around; align-items: center;
      padding-top: 0.8rem; border-top: 1px solid #ffe4e1; font-size: 0.9rem; color: #666;
    }
    .stat-item { display: flex; align-items: center; gap: 5px; }
    .like-btn { cursor: pointer; color: #ff1493; transition: transform 0.2s; user-select: none; }
    .like-btn:hover { transform: scale(1.2); }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center;
      padding: 1rem; backdrop-filter: blur(8px);
    }
    .modal-content {
      background: #fff; border-radius: 24px; max-width: 900px; width: 95%; max-height: 92vh;
      overflow-y: auto; display: flex; flex-direction: column; position: relative;
    }
    .close-modal { position: absolute; top: 15px; right: 20px; font-size: 2rem; color: #ff1493; cursor: pointer; z-index: 1010; font-weight: bold; }
    
    .modal-img-box { width: 100%; background: #0e0414; display: flex; justify-content: center; align-items: center; padding: 1rem; }
    .modal-img-box img { max-width: 100%; max-height: 60vh; object-fit: contain; border-radius: 12px; }

    .modal-details { padding: 1.5rem 2rem; }
    .comments-section { margin-top: 1.5rem; border-top: 2px solid #ffe4e1; padding-top: 1rem; }
    .comment-box { max-height: 150px; overflow-y: auto; background: #fdf2f8; padding: 1rem; border-radius: 12px; margin-bottom: 1rem; }
    .comment-item { padding: 0.4rem 0; border-bottom: 1px dashed #f472b6; font-size: 0.95rem; word-break: break-word; }
    .comment-item:last-child { border-bottom: none; }
    
    .comment-inputs { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .comment-inputs input { padding: 0.6rem 1rem; border: 1px solid #ff69b4; border-radius: 20px; outline: none; }
    .comment-inputs button { background: #ff1493; color: white; border: none; padding: 0.6rem 1.5rem; border-radius: 20px; cursor: pointer; font-weight: 600; }
    .comment-inputs button:hover { background: #db2777; }
  </style>
</head>
<body>

  <header>
    <div class="header-title"><i class="fa-solid fa-sparkles"></i> Amil FanArt Gallery <i class="fa-solid fa-sparkles"></i></div>
    <div class="header-sub">💖 รวบรวมผลงานความน่ารักสไตล์ประกายดาวของ Amil 💖</div>
    
    <a href="https://forms.gle/KnrAA5HKAx2bnjKX6" target="_blank" class="upload-btn-main">
      <i class="fa-solid fa-cloud-arrow-up"></i> ส่งผลงานแฟนอาร์ต
    </a>
  </header>

  <div class="container">
    <div id="loading" style="text-align: center; color: #fff; font-size: 1.2rem; padding: 3rem;">
      <i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลดผลงานแฟนอาร์ต...
    </div>
    <div id="gallery" class="gallery-grid"></div>
  </div>

  <div id="imageModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-modal" onclick="closeModalDirect()">&times;</span>
      
      <div class="modal-img-box">
        <img id="modalImg" src="" alt="Full Image">
      </div>

      <div class="modal-details">
        <h2 id="modalTitle" style="color:#2a0845;"></h2>
        <p id="modalArtist" style="color:#ff1493; font-weight:600; margin-bottom: 1rem;"></p>
        
        <div class="card-stats" style="font-size: 1rem; padding-bottom: 1rem; justify-content: flex-start; gap: 2rem;">
          <span class="stat-item like-btn" id="modalLikeBtn"><i class="fa-solid fa-heart"></i> <span id="modalLikes">0</span> ไลก์</span>
          <span class="stat-item"><i class="fa-regular fa-comment"></i> <span id="modalCommentsCount">0</span> คอมเมนต์</span>
        </div>

        <div class="comments-section">
          <h4 style="color:#2a0845; margin-bottom:0.5rem;"><i class="fa-regular fa-comments"></i> ความคิดเห็น</h4>
          <div id="commentList" class="comment-box"></div>

          <div class="comment-inputs">
            <input type="text" id="commentUser" placeholder="ชื่อของคุณ" style="flex: 1; min-width: 120px;">
            <input type="text" id="commentText" placeholder="เขียนความคิดเห็น..." style="flex: 2; min-width: 200px;">
            <button onclick="submitComment()"><i class="fa-solid fa-paper-plane"></i> ส่ง</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIuja-4prdqqL4_7_sryl1Eqh-wktx2gTFw9qB8z-VYQ8rw03nJazptTKHTJ5Nh1eA2Q/exec";
    let artData = [];
    let currentModalIndex = -1;

    async function loadGalleryData() {
      try {
        const response = await fetch(SCRIPT_URL);
        artData = await response.json();
        renderGallery();
      } catch (err) {
        document.getElementById("loading").innerHTML = "ไม่สามารถเชื่อมต่อตารางได้เจ้าค่ะ";
      }
    }

    function renderGallery() {
      document.getElementById("loading").style.display = "none";
      const gallery = document.getElementById("gallery");
      gallery.innerHTML = "";

      if (!artData || artData.length === 0) {
        gallery.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #fff;">ยังไม่มีผลงานแฟนอาร์ต กดปุ่มด้านบนเพื่อส่งรูปแรกได้เลยเจ้าค่ะ!</p>`;
        return;
      }

      artData.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-img-wrapper" onclick="openModal(${index})">
            <img src="${item.imageUrl}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/400?text=Amil+Fanart'">
          </div>
          <div class="card-body">
            <div class="card-title">${item.title}</div>
            <div class="card-artist"><i class="fa-solid fa-paint-brush"></i> ${item.artist}</div>
            <div class="card-stats">
              <span class="stat-item like-btn" onclick="addLike(${index}, event)"><i class="fa-solid fa-heart"></i> <span id="like-count-${index}">${item.likes}</span></span>
              <span class="stat-item"><i class="fa-regular fa-comment"></i> <span id="comment-count-${index}">${item.comments.length}</span></span>
            </div>
          </div>
        `;
        gallery.appendChild(card);
      });
    }

    function openModal(index) {
      currentModalIndex = index;
      const item = artData[index];
      
      document.getElementById("modalImg").src = item.imageUrl;
      document.getElementById("modalTitle").innerText = item.title;
      document.getElementById("modalArtist").innerHTML = `<i class="fa-solid fa-paint-brush"></i> วาดโดย: ${item.artist}`;
      document.getElementById("modalLikes").innerText = item.likes;
      document.getElementById("modalCommentsCount").innerText = item.comments.length;
      
      document.getElementById("modalLikeBtn").onclick = (e) => addLike(index, e);

      renderComments(item.comments);
      document.getElementById("imageModal").style.display = "flex";
    }

    function renderComments(comments) {
      const box = document.getElementById("commentList");
      box.innerHTML = "";
      if (!comments || comments.length === 0) {
        box.innerHTML = `<p style="color:#888; font-size:0.9rem;">ยังไม่มีความคิดเห็น มาเป็นคนแรกกันเลย!</p>`;
        return;
      }
      comments.forEach(c => {
        const div = document.createElement("div");
        div.className = "comment-item";
        div.innerText = c;
        box.appendChild(div);
      });
    }

    function sendDataToSheet(params) {
      const query = new URLSearchParams(params).toString();
      const img = new Image();
      img.src = SCRIPT_URL + "?" + query;
    }

    function addLike(index, event) {
      if (event) event.stopPropagation();
      const item = artData[index];
      item.likes++;
      
      document.getElementById(`like-count-${index}`).innerText = item.likes;
      if (currentModalIndex === index) {
        document.getElementById("modalLikes").innerText = item.likes;
      }

      sendDataToSheet({ action: "like", rowIndex: item.rowIndex });
    }

    function submitComment() {
      if (currentModalIndex === -1) return;
      const user = document.getElementById("commentUser").value.trim() || "ผู้เข้าชม";
      const text = document.getElementById("commentText").value.trim();

      if (!text) return;

      const item = artData[currentModalIndex];
      const newCommentFormat = user + ": " + text;
      
      item.comments.push(newCommentFormat);
      renderComments(item.comments);
      
      document.getElementById("modalCommentsCount").innerText = item.comments.length;
      document.getElementById(`comment-count-${currentModalIndex}`).innerText = item.comments.length;
      document.getElementById("commentText").value = "";

      sendDataToSheet({ 
        action: "comment", 
        rowIndex: item.rowIndex, 
        user: user, 
        text: text 
      });
    }

    function closeModal(e) {
      if (e.target.id === "imageModal") closeModalDirect();
    }

    function closeModalDirect() {
      document.getElementById("imageModal").style.display = "none";
      currentModalIndex = -1;
    }

    loadGalleryData();
  </script>
</body>
</html>
